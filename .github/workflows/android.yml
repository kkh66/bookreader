# Unit tests + release APK on every push to main and every pull request;
# pushing a tag like v0.3.9 also publishes the signed APK to GitHub Releases.
#
# Signing uses these repository secrets (without them the APK is unsigned; tags refuse to release unsigned):
#   RELEASE_KEYSTORE_BASE64  base64 of the .jks keystore
#   RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the build still running for the older one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # creating the release on tags
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      # Read by app/build.gradle.kts as Gradle properties; ignored unless a keystore is set up below
      ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v6

      - name: Read version
        id: version
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Check tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.version.outputs.name }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName ${{ steps.version.outputs.name }}"
            exit 1
          fi
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing; refusing to release an unsigned APK"
            exit 1
          fi

      - name: Set up signing keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ORG_GRADLE_PROJECT_RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # Kotlin compiles in the Gradle process so the runner's memory isn't split across two JVMs
      - name: Unit tests and release APK
        run: ./gradlew testDebugUnitTest assembleRelease -Pkotlin.compiler.execution.strategy=in-process

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/BookReader-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: BookReader-${{ steps.version.outputs.name }}-${{ github.sha }}
          path: dist/*.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          generate_release_notes: true
